version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    - pip install torch onnx pelican markdown
    - pelican --settings docs/pelicanconf.py --output $READTHEDOCS_OUTPUT/html/ docs/
    # ← new diagnostics line:
    - find $READTHEDOCS_OUTPUT/html/ -maxdepth 2 -type f -print
