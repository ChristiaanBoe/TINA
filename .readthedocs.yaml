version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    # install your runtime + Pelican + Markdown support
    - pip install torch onnx pelican markdown
    # build the site
    - pelican --settings docs/pelicanconf.py \
              --output $READTHEDOCS_OUTPUT/html/ \
              docs/
