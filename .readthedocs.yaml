version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  commands:
    # 1) install your deps + Markdown support
    - pip install torch onnx pelican markdown
    # 2) build with Pelican (no backslashes—one line only!)
    - pelican --settings docs/pelicanconf.py --output $READTHEDOCS_OUTPUT/html/ docs/
